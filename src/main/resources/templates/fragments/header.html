
<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<body>

<header th:fragment="header(title)"
        class="bg-orange-800 text-orange-100 body-font py-4">

    <div class="container mx-auto px-5 flex items-center justify-between relative">

        <!-- Catalogue icon (left) -->
        <a href="/catalogue"
           class="text-3xl hover:text-gray-200 transition-colors"
           title="Catalogue"
           aria-label="Catalogue">

            <svg xmlns="http://www.w3.org/2000/svg"
                 width="28"
                 height="28"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round">
                <path d="M12 21V7a2 2 0 0 1 2-2h7.4a.6.6 0 0 1 .6.6v13.114"/>
                <path d="M12 21V7a2 2 0 0 0-2-2H2.6a.6.6 0 0 0-.6.6v13.114"/>
                <path d="M14 19h8m-12 0H2"/>
            </svg>
        </a>

        <!-- Centered title -->
        <h1 class="absolute left-1/2 -translate-x-1/2 text-center
                   text-2xl sm:text-3xl md:text-4xl font-bold
                   truncate max-w-[65%]">

            <a href="/" th:text="${title}">
                Page Title
            </a>

        </h1>

        <!-- Admin icon (right) -->
        <a href="/admin"
           class="text-3xl hover:text-gray-200 transition-colors"
           title="Edit"
           aria-label="Edit">

            <svg xmlns="http://www.w3.org/2000/svg"
                 width="28" height="28"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round">
                <path d="m18 5 1.4 1.4"/>
                <path d="M20.4 3.6a2 2 0 0 1 0 2.8L9 17.8 4 19l1.2-5L16.6 3.6a2 2 0 0 1 2.8 0Z"/>
                <path d="M8 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4"/>
            </svg>

        </a>

    </div>

</header>

</body>
</html>
