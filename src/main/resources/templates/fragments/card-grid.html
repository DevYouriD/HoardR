<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<body>

<div th:fragment="grid(cards)">

    <!-- Search bar -->
    <div class="mb-8">
        <input
                type="text"
                id="cardSearch"
                placeholder="Search cards by name or number..."
                class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm
                       focus:outline-none focus:ring-2 focus:ring-orange-700
                       focus:border-orange-700"
                oninput="filterCards()">
    </div>

    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(cards)}"
         class="text-center py-16">

        <h2 class="text-xl font-semibold text-gray-700">
            No cards found
        </h2>

        <p class="text-gray-500 mt-2">
            Your collection is currently empty.
        </p>

    </div>

    <!-- Card grid -->
    <div th:unless="${#lists.isEmpty(cards)}"
         id="cardGrid"
         class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-5">

        <div th:each="card : ${cards}"
             class="card-item bg-white rounded-lg border border-gray-200 overflow-hidden shadow-sm hover:shadow-lg transition-shadow"
             th:attr="data-name=${card.name},data-number=${card.number}">

            <!-- Card image -->
            <div class="bg-gray-100 aspect-[3/4] flex items-center justify-center p-2">

                <img th:if="${card.face != null and !#strings.isEmpty(card.face)}"
                     th:src="${card.face}"
                     th:alt="${card.name}"
                     loading="lazy"
                     class="w-full h-full object-contain">

                <div th:unless="${card.face != null and !#strings.isEmpty(card.face)}"
                     class="text-gray-400 text-sm text-center">
                    No image available
                </div>

            </div>

            <!-- Card information -->
            <div class="p-3">

                <h2 class="font-semibold text-gray-900 truncate"
                    th:text="${card.name}"
                    th:title="${card.name}">
                    Card name
                </h2>

                <p class="text-sm text-gray-500 mt-1">
                    #<span th:text="${card.number}">001</span>
                </p>

                <!-- Collection status -->
                <div class="mt-3">
                    <span th:if="${card.collected}"
                          class="inline-block bg-green-100 text-green-800 text-xs font-semibold px-2 py-1 rounded">
                        Owned
                    </span>

                    <span th:unless="${card.collected}"
                          class="inline-block bg-orange-100 text-orange-800 text-xs font-semibold px-2 py-1 rounded">
                        Missing
                    </span>
                </div>

            </div>

        </div>

    </div>

    <!-- No search results -->
    <div id="noSearchResults"
         class="hidden text-center py-10 text-gray-500">
        No cards match your search.
    </div>

    <!-- Search functionality -->
    <script>
        function filterCards() {
            const searchInput = document.getElementById("cardSearch");
            const searchTerm = searchInput.value.toLowerCase().trim();

            const cards = document.querySelectorAll(".card-item");
            const noResults = document.getElementById("noSearchResults");

            let visibleCards = 0;

            cards.forEach(card => {
                const name = card.dataset.name.toLowerCase();
                const number = card.dataset.number.toLowerCase();

                const matches =
                    name.includes(searchTerm) ||
                    number.includes(searchTerm);

                card.classList.toggle("hidden", !matches);

                if (matches) {
                    visibleCards++;
                }
            });

            noResults.classList.toggle("hidden", visibleCards > 0);
        }
    </script>

</div>

</body>
</html>
